{% macro champ(f, classe='', aide=None, requis=False) %}
<div class="champ {{ classe }} {{ 'erreur' if f.errors }}" id="champ-{{ f.name }}">
  <label for="{{ f.id }}">{{ f.label.text }}{% if requis %} <span class="req">*</span>{% endif %}</label>
  {{ f(**kwargs) }}
  {% for e in f.errors %}<div class="msg-erreur">{{ e }}</div>{% endfor %}
  {% if aide %}<div class="aide">{{ aide }}</div>{% endif %}
</div>
{% endmacro %}

{% macro niveau(n) %}<span class="niveau" title="Niveau {{ n }}/4">{% for i in range(1,5) %}<i class="{{ 'on' if i <= n }}"></i>{% endfor %}</span>{% endmacro %}

{% macro code(p) %}<span class="code {{ 'code-mgmt' if p.categorie == 'management' }}">{{ p.code }}</span>{% endmacro %}
